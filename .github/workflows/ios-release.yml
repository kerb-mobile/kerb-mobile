name: iOS release

# Archives the app with an Apple Distribution certificate, exports an App Store
# .ipa and, unless told not to, uploads it to App Store Connect. No Mac, no Xcode
# and no Apple ID are needed on the developer machine: the signing identity comes
# from a repository secret and an API key authenticates everything Apple-side.
#
# Manual only — an upload cannot be undone — so it never runs on push:
#   Actions -> iOS release -> Run workflow
# Run it once with "upload" unticked to prove signing and export without sending
# anything; the .ipa comes back as a build artifact.
#
# The six secrets and the portal steps that create them are in
# store/submission-guide.md. Until they exist the job stops at the first step.

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'CFBundleVersion to use (blank = derived from the run and attempt)'
        required: false
        default: ''
      upload:
        description: 'Upload the .ipa to App Store Connect'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  release:
    name: Archive, export and upload
    runs-on: macos-26
    timeout-minutes: 60
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the six secrets
        run: |
          set -euo pipefail
          missing=""
          for name in APPLE_TEAM_ID APPSTORE_KEY_ID APPSTORE_ISSUER_ID \
                      APPSTORE_PRIVATE_KEY APPLE_CERTIFICATE_P12 APPLE_CERTIFICATE_PASSWORD; do
            [ -n "${!name:-}" ] || missing="$missing $name"
          done
          [ -z "$missing" ] || {
            echo "::error::Missing repository secret(s):$missing"
            echo "See store/submission-guide.md, section iOS release."
            exit 1
          }

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      # The web bundle is what the shell loads, so it has to be copied in before
      # the archive or the upload ships the previous shell state.
      - name: Install and sync the web bundle
        run: |
          npm ci
          npx cap sync ios

      - name: Import the distribution certificate
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/kerb-signing.keychain-db"
          PASSWORD="$(openssl rand -hex 24)"

          echo -n "$APPLE_CERTIFICATE_P12" | base64 --decode -o "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          # Without this, codesign blocks on an authorization prompt nobody can
          # answer on a runner.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security default-keychain -s "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12"

          IDENTITIES="$(security find-identity -v -p codesigning "$KEYCHAIN")"
          echo "$IDENTITIES"
          echo "$IDENTITIES" | grep -q "Apple Distribution" || {
            echo "::error::APPLE_CERTIFICATE_P12 is not an Apple Distribution identity with its private key."
            echo "Export the .p12 from Keychain Access, not the .cer."
            exit 1
          }

      - name: Place the App Store Connect API key
        run: |
          set -euo pipefail
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8"
          mkdir -p "$(dirname "$KEY_PATH")"
          printf '%s\n' "$APPSTORE_PRIVATE_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Archive
        env:
          BUILD_NUMBER_INPUT: ${{ inputs.build_number }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          # run_number is identical when a run is re-run, so a retry would reuse a
          # build number App Store Connect already has. Fold the attempt in: run 7
          # attempt 2 becomes 702, above 701 and below run 8's 801.
          BUILD_NUMBER="$BUILD_NUMBER_INPUT"
          if [ -z "$BUILD_NUMBER" ]; then
            case "$RUN_ATTEMPT" in ''|*[!0-9]*) RUN_ATTEMPT=1 ;; esac
            [ "$RUN_ATTEMPT" -lt 100 ] || {
              echo "::error::Attempt $RUN_ATTEMPT does not fit the scheme; pass build_number."
              exit 1
            }
            BUILD_NUMBER=$(( RUN_NUMBER * 100 + RUN_ATTEMPT ))
          fi
          case "$BUILD_NUMBER" in
            ''|*[!0-9]*) echo "::error::build_number must be a whole number, got '$BUILD_NUMBER'"; exit 1 ;;
          esac
          echo "UPLOAD_BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "Archiving 1.0 ($BUILD_NUMBER)"

          xcodebuild -version
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Kerb.xcarchive \
            -derivedDataPath build/DerivedData \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            archive

      - name: Check the archive
        run: |
          set -euo pipefail
          APP="build/Kerb.xcarchive/Products/Applications/App.app"
          test -d "$APP" || { echo "::error::The archive contains no app"; exit 1; }

          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")"
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")"
          BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")"
          echo "Built $BUNDLE_ID $VERSION ($BUILD)"
          [ "$BUNDLE_ID" = "com.kerbgo.app" ] || { echo "::error::Unexpected bundle id $BUNDLE_ID"; exit 1; }
          [ "$BUILD" = "$UPLOAD_BUILD_NUMBER" ] || {
            echo "::error::Archive carries build $BUILD, expected $UPLOAD_BUILD_NUMBER"
            exit 1
          }

          SIGNING="$(codesign -dv --verbose=2 "$APP" 2>&1)"
          echo "$SIGNING" | grep -E "^(Identifier|Authority|TeamIdentifier)="
          TEAM="$(echo "$SIGNING" | sed -n 's/^TeamIdentifier=//p')"
          [ "$TEAM" = "$APPLE_TEAM_ID" ] || {
            echo "::error::Signed by team '$TEAM', not APPLE_TEAM_ID ('$APPLE_TEAM_ID')"
            exit 1
          }
          codesign --verify --strict "$APP"

      - name: Export the App Store package
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath build/Kerb.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ios/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID"
          ls -l build/export

      - name: Upload to App Store Connect
        if: ${{ inputs.upload }}
        run: |
          set -euo pipefail
          IPA="$(find build/export -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$IPA" || { echo "::error::No .ipa was exported"; exit 1; }
          echo "Uploading $IPA"
          # --upload-app is deprecated in favour of --upload-package but still
          # uploads and needs no identifiers beyond the key.
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$APPSTORE_KEY_ID" --apiIssuer "$APPSTORE_ISSUER_ID"

      - name: Keep the .ipa
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: kerb-ios-${{ github.run_number }}-${{ github.run_attempt }}
          path: build/export/*.ipa
          if-no-files-found: warn
          retention-days: 14
