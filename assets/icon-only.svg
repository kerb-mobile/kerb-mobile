  <circle cx="32" cy="32" r="24" fill="none" stroke="#FD5204" stroke-width="4" />
  <rect x="22" y="18" width="7" height="28" rx="1.5" fill="#FFFFFF" />
  <path d="M31 32 L42 18" stroke="#FFFFFF" stroke-width="7" stroke-linecap="butt" />
  <path d="M31 32 L42 46" stroke="#FFFFFF" stroke-width="7" stroke-linecap="butt" />
</svg>
