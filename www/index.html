<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Kerb</title>
    <style>
      :root {
        --bg: #ffffff;
        --fg: #101418;
        --muted: #5b6572;
        --accent: #0f7b5f;
        --card: #f5f7f6;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0c0f11;
          --fg: #f2f5f4;
          --muted: #9aa5a1;
          --accent: #3ddc97;
          --card: #151a1c;
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px;
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        text-align: center;
        -webkit-text-size-adjust: 100%;
      }
      main { max-width: 340px; width: 100%; }
      .mark {
        font-size: 34px;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin-bottom: 4px;
      }
      .tagline { color: var(--muted); font-size: 14px; margin-bottom: 28px; }
      .card {
        background: var(--card);
        border-radius: 16px;
        padding: 20px;
      }
      h1 { font-size: 17px; margin: 0 0 8px; font-weight: 600; }
      p { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
      button {
        appearance: none;
        border: 0;
        border-radius: 999px;
        background: var(--accent);
        color: #04120d;
        font: inherit;
        font-weight: 600;
        padding: 13px 22px;
        width: 100%;
        cursor: pointer;
      }
      button:active { opacity: 0.8; }
      .status { margin-top: 16px; font-size: 12px; color: var(--muted); min-height: 16px; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">Kerb</div>
      <div class="tagline">Rides and groceries, right to your curb.</div>
      <div class="card">
        <h1 id="title">Connecting to Kerb</h1>
        <p id="body">Kerb could not be reached just now. Your trips and account are unaffected — try again in a moment.</p>
        <button id="retry" type="button">Try again</button>
        <div class="status" id="status"></div>
      </div>
    </main>
    <script>
      // This page is the app's offline / load-failure screen. Capacitor shows it via
      // server.errorPath when the remote site cannot be reached; the app itself always
      // loads the live site from https://www.kerbgo.com.
      //
      // A cold start can fail that very first request while the phone is still bringing
      // its network up (navigator.onLine is often false for a second or two even though
      // the connection is fine), so the first failure is not a verdict. This screen
      // probes the site and leaves for it as soon as a real request succeeds; the button
      // stays for a deliberate retry, and the screen is never left stale.
      //
      // Note: this has to live here rather than in shell-tweak.js. That patch is injected
      // into kerbgo.com documents only (/app and /driver), and this failure happens before
      // any kerbgo.com document exists.
      var REMOTE = 'https://www.kerbgo.com/';
      // Native shells load this page with ?reason=http when the site itself answered
      // 4xx (a hosting outage, not a dead network). A 4xx response proves the network
      // is fine, so the auto-probe below would treat it as success and bounce straight
      // back to the error page — that loop is what this flag prevents. Recovery in
      // that case belongs to the shell, which polls the site and reloads it once it
      // serves again.
      var HTTP_ERROR = /[?&]reason=http(?:&|$)/.test(window.location.search);
      var PROBE_TIMEOUT = 6000;
      var FIRST_DELAY = 800;
      var MAX_DELAY = 10000;

      var titleEl = document.getElementById('title');
      var bodyEl = document.getElementById('body');
      var statusEl = document.getElementById('status');
      var retryButton = document.getElementById('retry');

      var timer = null;
      var delay = FIRST_DELAY;
      var probing = false;
      var leaving = false;

      function setCopy(headline, detail) {
        titleEl.textContent = headline;
        bodyEl.textContent = detail;
      }

      function leave() {
        if (leaving) {
          return;
        }
        leaving = true;
        window.clearTimeout(timer);
        statusEl.textContent = 'Connected. Opening Kerb…';
        // replace() so the error page does not stay in history behind the site.
        window.location.replace(REMOTE);
      }

      function waitForConnection() {
        if (leaving) {
          return;
        }
        window.clearTimeout(timer);
        timer = window.setTimeout(probe, delay);
        delay = Math.min(Math.round(delay * 1.6), MAX_DELAY);
        if (navigator.onLine === false) {
          setCopy(
            'Connecting to Kerb',
            'The phone is not on a network yet. Kerb will open by itself as soon as one is available.'
          );
          statusEl.textContent = 'Waiting for a connection…';
        } else {
          setCopy(
            'Connecting to Kerb',
            'Kerb did not answer the first time. This usually clears on its own within a few seconds.'
          );
          statusEl.textContent = 'Reconnecting…';
        }
      }

      /**
       * A real request is the only trustworthy signal here: navigator.onLine reports
       * false on a cold start while the network stack is still attaching, which is how
       * a working phone ended up parked on an "offline" screen.
       */
      function probe() {
        if (leaving || probing) {
          return;
        }
        probing = true;

        var controller = typeof AbortController === 'function' ? new AbortController() : null;
        var cutOff = window.setTimeout(function () {
          if (controller) {
            controller.abort();
          }
        }, PROBE_TIMEOUT);

        // cors, not no-cors: a no-cors response is opaque, so a 404 looks exactly
        // like a healthy page and this screen would leave for the error and come
        // straight back. Only a readable status below 400 counts as connected.
        // When the site sends no CORS header the probe simply fails, which is
        // correct here — the native shells retry the site themselves.
        fetch(REMOTE, {
          method: 'GET',
          mode: 'cors',
          cache: 'no-store',
          signal: controller ? controller.signal : undefined
        }).then(
          function (response) {
            window.clearTimeout(cutOff);
            probing = false;
            if (response && response.status >= 400) {
              waitForConnection();
              return;
            }
            leave();
          },
          function () {
            window.clearTimeout(cutOff);
            probing = false;
            waitForConnection();
          }
        );
      }

      retryButton.addEventListener('click', function () {
        statusEl.textContent = 'Reconnecting…';
        window.location.href = REMOTE;
      });

      // None of the automatic retries make sense for a server-side error: the network
      // is up, so they would leave for a page that is still failing.
      if (!HTTP_ERROR) {
        // A connection coming back is the strongest hint there is, so skip the backoff.
        window.addEventListener('online', function () {
          delay = FIRST_DELAY;
          probe();
        });
        window.addEventListener('offline', function () {
          waitForConnection();
        });
        // Coming back from the background restarts the page from a restored render.
        window.addEventListener('pageshow', function () {
          if (!leaving) {
            probe();
          }
        });
      }

      if (HTTP_ERROR) {
        setCopy(
          'Kerb is temporarily unavailable',
          'Kerb could not load just now. Your trips and account are unaffected — try again in a moment.'
        );
        statusEl.textContent = 'The Kerb service is not answering.';
      } else {
        // First paint: schedule a probe immediately instead of believing what the
        // browser says about the network right now.
        waitForConnection();
      }
    </script>
  </body>
</html>
