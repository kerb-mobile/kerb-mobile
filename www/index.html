<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Kerb</title>
    <style>
      :root {
        --bg: #ffffff;
        --fg: #101418;
        --muted: #5b6572;
        --accent: #0f7b5f;
        --card: #f5f7f6;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0c0f11;
          --fg: #f2f5f4;
          --muted: #9aa5a1;
          --accent: #3ddc97;
          --card: #151a1c;
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px;
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        text-align: center;
        -webkit-text-size-adjust: 100%;
      }
      main { max-width: 340px; width: 100%; }
      .mark {
        font-size: 34px;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin-bottom: 4px;
      }
      .tagline { color: var(--muted); font-size: 14px; margin-bottom: 28px; }
      .card {
        background: var(--card);
        border-radius: 16px;
        padding: 20px;
      }
      h1 { font-size: 17px; margin: 0 0 8px; font-weight: 600; }
      p { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
      button {
        appearance: none;
        border: 0;
        border-radius: 999px;
        background: var(--accent);
        color: #04120d;
        font: inherit;
        font-weight: 600;
        padding: 13px 22px;
        width: 100%;
        cursor: pointer;
      }
      button:active { opacity: 0.8; }
      .status { margin-top: 16px; font-size: 12px; color: var(--muted); min-height: 16px; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">Kerb</div>
      <div class="tagline">Rides and groceries, right to your curb.</div>
      <div class="card">
        <h1 id="title">Connecting to Kerb</h1>
        <p id="body">We could not reach kerbgo.com. Check your connection and try again.</p>
        <button id="retry" type="button">Try again</button>
        <div class="status" id="status"></div>
      </div>
    </main>
    <script>
      // This page is the app's offline / load-failure screen. Capacitor shows it via
      // server.errorPath when the remote site cannot be reached; the app itself always
      // loads the live site from https://www.kerbgo.com.
      var REMOTE = 'https://www.kerbgo.com/';

      function diagnostic() {
        var online = navigator.onLine !== false;
        document.getElementById('title').textContent = online ? 'Connecting to Kerb' : 'You are offline';
        document.getElementById('body').textContent = online
          ? 'Kerb could not be reached just now. Your trips and account are unaffected — try again in a moment.'
          : 'Kerb needs a connection to load rides, fares and navigation. Reconnect and try again.';
      }

      function retry() {
        var status = document.getElementById('status');
        status.textContent = 'Reconnecting…';
        // A hard assignment (not location.replace) so history does not keep the error page.
        window.location.href = REMOTE;
      }

      document.getElementById('retry').addEventListener('click', retry);
      window.addEventListener('online', diagnostic);
      window.addEventListener('offline', diagnostic);
      diagnostic();
    </script>
  </body>
</html>
